# Конфігурація gitleaks для BRAVO Archive.
#
# Правила за замовчуванням лишаються повністю активними — розширюємо їх,
# а не замінюємо.
[extend]
useDefault = true

# TOOLS_MANIFEST.json і RUNTIME_MANIFEST.json складаються з SHA-256
# контрольних сум (64 hex-символи). Для gitleaks це високоентропійні
# рядки поруч зі словами на кшталт "Credentials" у назвах файлів, тому
# правило generic-api-key бачить у них API-ключі.
#
# Це саме те, чим вони не є: контрольна сума файлу — публічна за
# природою, вона друкується в логах і в повідомленнях про помилки. Її
# приховування не має сенсу, а можливість обчислити її з самого файлу
# робить її нерозкриваючою.
#
# Виняток навмисно вузький — condition = "AND": звільняються ЛИШЕ
# 64-символьні hex-рядки ЛИШЕ у двох файлах маніфестів. Справжній секрет,
# який випадково потрапить у ці ж файли, майже напевно не матиме форми
# рівно 64 hex-символів; будь-який секрет у будь-якому іншому файлі
# сканується як і раніше.
[allowlist]
description = "SHA-256 у маніфестах цілісності не є секретами"
condition = "AND"
paths = [
    '''(^|/)TOOLS_MANIFEST\.json$''',
    '''(^|/)RUNTIME_MANIFEST\.json$'''
]
regexes = [
    '''\b[A-Fa-f0-9]{64}\b'''
]
