name: CI

# AUD-001 (аудит P0.1): обов'язковий CI gate. Раніше "self-test PASSED"
# у PR-описі був лише твердженням автора — GitHub це ніяк не підтверджував
# незалежно. Проєкт цільово Windows PowerShell 5.1 (не PowerShell 7/pwsh —
# у цій репозиторії вже траплялись реальні поведінкові розбіжності між
# 5.1 і 7, наприклад .Count на String), тому раннер — windows-latest, а
# кроки виконуються через `shell: powershell` (вбудований alias на
# Windows PowerShell 5.1 у GitHub Actions), а не `pwsh`.

on:
  push:
    branches: [master, developer]
  pull_request:
    branches: [master, developer]
  workflow_dispatch:

jobs:
  static-checks:
    name: Parser / BOM / JSON
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell parser (усі .ps1/.psm1/.psd1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }
          $failed = $false
          foreach ($file in $files) {
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) {
                  Write-Host "::error file=$($file.FullName)::$(($parseErrors | ForEach-Object { $_.Message }) -join ' | ')"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      - name: UTF-8 BOM (обов'язковий для .ps1/.psm1/.psd1 з кирилицею)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }
          $failed = $false
          foreach ($file in $files) {
              $bytes = [IO.File]::ReadAllBytes($file.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if (-not $hasBom) {
                  Write-Host "::error file=$($file.FullName)::Відсутній UTF-8 BOM"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      - name: JSON коректний (VERSION.json, TOOLS_INTEGRITY.json тощо)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $jsonFiles = Get-ChildItem -Recurse -File -Filter '*.json' |
              Where-Object { $_.FullName -notmatch '\\LOGS\\' }
          foreach ($file in $jsonFiles) {
              try {
                  [void](Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop)
              } catch {
                  Write-Host "::error file=$($file.FullName)::Некоректний JSON: $($_.Exception.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # Патерни, які PSScriptAnalyzer або не ловить взагалі, або ловить
      # лише як AST (і пропускає входження всередині рядків). Список
      # навмисно вузький: кожен пункт — те, чого в цьому репозиторії
      # немає й не повинно з'явитись.
      - name: Заборонені патерни (bootstrap-завантаження, довільний код)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File |
              Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }

          # ExecutionPolicy Bypass легітимний лише там, де скрипт
          # перезапускає сам себе через UAC або описує завдання
          # Планувальника (задокументовано в SECURITY.md розділ 4).
          # Мета правила — заблокувати НОВІ файли з Bypass, а не
          # переписати наявний механізм elevation.
          $bypassAllowlist = @(
              'BRAVO_TASKS_INSTALL.ps1',
              'BRAVO_TASKS_UNINSTALL.ps1',
              'BRAVO_CREDENTIALS_SETUP.ps1',
              'BRAVO_SELF_TEST.ps1',
              'BRAVO.Archive.Runtime.ps1',
              'BRAVO.Maintenance.Runtime.ps1'
          )

          $forbidden = @(
              @{ Name = 'Invoke-Expression / iex'; Pattern = '(?i)\b(Invoke-Expression|iex)\s'; Allowlist = @() },
              @{ Name = 'Мережеве завантаження коду'; Pattern = '(?i)(DownloadString|DownloadFile|Net\.WebClient|Invoke-RestMethod\s+[^|]*\|\s*iex)'; Allowlist = @() },
              @{ Name = 'Секрет в аргументах процесу'; Pattern = '(?i)-ArgumentList[^\r\n]*\$(password|secret|apiKey|token)\b'; Allowlist = @() },
              @{ Name = 'ExecutionPolicy Bypass поза installer/task definitions'; Pattern = '(?i)ExecutionPolicy\s+Bypass'; Allowlist = $bypassAllowlist }
          )

          $failed = $false
          foreach ($file in $files) {
              $lines = [IO.File]::ReadAllLines($file.FullName)
              for ($i = 0; $i -lt $lines.Length; $i++) {
                  $line = $lines[$i]
                  # Рядки-коментарі не є виконуваним кодом (у репозиторії
                  # є приклади команд запуску в коментарях).
                  if ($line.TrimStart().StartsWith('#')) { continue }

                  foreach ($rule in $forbidden) {
                      if ($line -match $rule.Pattern) {
                          if ($rule.Allowlist -contains $file.Name) { continue }
                          Write-Host "::error file=$($file.FullName),line=$($i + 1)::Заборонений патерн ($($rule.Name)): $($line.Trim())"
                          $failed = $true
                      }
                  }
              }
          }
          if ($failed) {
              Write-Host "::error::Знайдено заборонені патерни. Ці конструкції не мають легітимного застосування в цьому репозиторії."
              exit 1
          }
          Write-Host "Заборонені патерни: не знайдено."

      - name: Markdown-документи не мають BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $mdFiles = Get-ChildItem -Recurse -File -Filter '*.md'
          foreach ($file in $mdFiles) {
              $bytes = [IO.File]::ReadAllBytes($file.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if ($hasBom) {
                  Write-Host "::error file=$($file.FullName)::Markdown не повинен мати BOM (усталена конвенція репозиторію)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -Repository PSGallery

      # Прохід 1 (БЛОКУЮЧИЙ): рівно набір security-правил із
      # PSScriptAnalyzerSettings.psd1. Жодне з них НЕ виключається
      # глобально — кожне обґрунтоване місце має точковий
      # SuppressMessageAttribute із Justification біля конкретної функції.
      # Тому будь-яке НОВЕ входження цих патернів завалить CI, навіть
      # якщо десь поруч уже є легітимне обґрунтоване використання.
      - name: PSScriptAnalyzer — security (блокує)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File |
              Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }

          # Пофайловий обхід, а не -Path . -Recurse: окремі правила
          # PSScriptAnalyzer здатні кинути NullReferenceException на
          # конкретному файлі й обірвати весь аналіз, замаскувавши решту.
          $results = @()
          foreach ($file in $files) {
              try {
                  $results += Invoke-ScriptAnalyzer `
                      -Path $file.FullName `
                      -Settings .\PSScriptAnalyzerSettings.psd1
              } catch {
                  Write-Host "::error file=$($file.FullName)::PSScriptAnalyzer впав на цьому файлі: $($_.Exception.Message)"
                  exit 1
              }
          }

          if ($results.Count -gt 0) {
              $results | ForEach-Object {
                  Write-Host "::error file=$($_.ScriptPath),line=$($_.Line)::$($_.RuleName): $($_.Message)"
              }
              Write-Host "::error::Заблоковано $($results.Count) security-порушень. Якщо використання обґрунтоване — додайте точковий [Diagnostics.CodeAnalysis.SuppressMessageAttribute] із Justification біля конкретної функції, НЕ глобальний виняток."
              exit 1
          }
          Write-Host "Security-набір PSScriptAnalyzer: чисто."

      # Прохід 2 (ІНФОРМАЦІЙНИЙ): усе інше — стилістика, що суперечить
      # усталеній архітектурі репозиторію (Write-Host для інтерактивної
      # консолі допоміжних скриптів, $global: як контракт між
      # BRAVO.config і runtime-модулями). Не блокує.
      - name: PSScriptAnalyzer — решта правил (інформаційно)
        shell: powershell
        continue-on-error: true
        run: |
          $files = Get-ChildItem -Recurse -File |
              Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') }
          $blocking = (Import-PowerShellDataFile .\PSScriptAnalyzerSettings.psd1).IncludeRules

          $results = @()
          foreach ($file in $files) {
              try {
                  $results += Invoke-ScriptAnalyzer -Path $file.FullName -ExcludeRule $blocking
              } catch {
                  Write-Host "::warning file=$($file.FullName)::PSScriptAnalyzer впав на цьому файлі: $($_.Exception.Message)"
              }
          }

          Write-Host "PSScriptAnalyzer (інформаційно): $($results.Count) зауважень."
          $results |
              Group-Object RuleName |
              Sort-Object Count -Descending |
              ForEach-Object { Write-Host "  $($_.Count)x $($_.Name)" }

  self-test:
    name: BRAVO_SELF_TEST.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Запуск повного self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\BRAVO_SELF_TEST.ps1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::BRAVO_SELF_TEST.ps1 завершився з кодом $LASTEXITCODE"
              exit 1
          }

      - name: Лог self-test (артефакт при падінні)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-log
          path: LOGS/HELPERS/BRAVO_SELF_TEST_*.log
          if-no-files-found: ignore

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action на pull_request-подіях звертається до GitHub API за
    # списком комітів PR (GET /pulls/{n}/commits) — без явного дозволу
    # pull-requests: read це падає 403 "Resource not accessible by
    # integration", хоча той самий workflow на push-подіях (де цей
    # виклик не потрібен) проходив без помилок.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
